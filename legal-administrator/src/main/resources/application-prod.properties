# Variables inyectadas por ECS Fargate; no se carga ningún archivo .env.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=verify-full&sslrootcert=${DB_SSL_ROOT_CERT:/app/certs/rds-global-bundle.pem}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.flyway.baseline-on-migrate=false
app.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS}
app.documents.provider=s3
app.documents.s3-bucket=${DOCUMENT_S3_BUCKET:legal-administrator-documents}
app.documents.aws-region=${AWS_REGION}
app.agenda.google.frontend-origin=${GOOGLE_FRONTEND_ORIGIN:${FRONTEND_ALLOWED_ORIGINS}}

# Conservar la configuración de logs y errores de producción.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.jdbc.core=WARN
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
