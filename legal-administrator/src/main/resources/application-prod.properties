# Variables inyectadas por Cloud Run; no se carga ningún archivo .env.
spring.datasource.url=jdbc:postgresql:///${DB_NAME}?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlRefreshStrategy=lazy&ipTypes=${CLOUD_SQL_IP_TYPES:PUBLIC}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.flyway.baseline-on-migrate=false
app.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS}
app.documents.provider=gcs
app.documents.gcs-bucket=${DOCUMENT_GCS_BUCKET}
app.agenda.google.frontend-origin=${GOOGLE_FRONTEND_ORIGIN:${FRONTEND_ALLOWED_ORIGINS}}

# Conservar la configuración de logs y errores de producción.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.jdbc.core=WARN
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
