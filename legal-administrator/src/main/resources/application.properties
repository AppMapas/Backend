spring.application.name=legal-administrator
spring.profiles.default=dev
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ==========================================
# Flyway es el único responsable del esquema; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JWT_SECRET
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Orígenes explícitos del frontend separados por comas; configurar en producción.
app.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Documentos privados: local durante desarrollo, S3 en AWS.
app.documents.provider=${DOCUMENT_STORAGE_PROVIDER:local}
app.documents.local-directory=${DOCUMENT_LOCAL_DIRECTORY:./data/documents}
app.documents.s3-bucket=${DOCUMENT_S3_BUCKET:}
app.documents.aws-region=${AWS_REGION:}
app.documents.max-file-size=${DOCUMENT_MAX_FILE_SIZE:20MB}
app.documents.max-request-size=${DOCUMENT_MAX_REQUEST_SIZE:21MB}
spring.servlet.multipart.max-file-size=${app.documents.max-file-size}
spring.servlet.multipart.max-request-size=${app.documents.max-request-size}
# El contenedor usa archivos temporales desde el primer byte y los limpia al finalizar la petición.
spring.servlet.multipart.file-size-threshold=0B

# Agenda interna siempre disponible; Google Calendar es una integración OAuth opcional.
app.agenda.google.enabled=${GOOGLE_CALENDAR_ENABLED:false}
app.agenda.google.client-id=${GOOGLE_CLIENT_ID:}
app.agenda.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.agenda.google.calendar-id=${GOOGLE_CALENDAR_ID:}
app.agenda.google.frontend-origin=${GOOGLE_FRONTEND_ORIGIN:http://localhost:5173}
app.agenda.google.encryption-key=${GOOGLE_TOKEN_ENCRYPTION_KEY:}
app.agenda.google.key-version=${GOOGLE_TOKEN_KEY_VERSION:v1}
app.agenda.google.sync-delay-ms=${GOOGLE_SYNC_DELAY_MS:30000}
