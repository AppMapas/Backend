# IntelliJ/Maven pueden leer el .env local; Docker inyecta sus variables.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/db_legal_administrator}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:administrador}
# Compatibilidad con volúmenes locales históricos inicializados mediante SQL.
spring.flyway.baseline-on-migrate=true
