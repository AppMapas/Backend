name: Deploy backend to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: legal-administrator-backend
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'LegalAdministrator' }}
      BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME || 'legal-administrator-backend' }}
      ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
      ECS_INFRASTRUCTURE_ROLE_ARN: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
      BACKEND_TASK_ROLE_ARN: ${{ vars.BACKEND_TASK_ROLE_ARN }}
      ECS_SUBNET_IDS: ${{ vars.ECS_SUBNET_IDS }}
      BACKEND_SECURITY_GROUP_IDS: ${{ vars.BACKEND_SECURITY_GROUP_IDS }}
      RDS_INSTANCE_ID: db-legal-administrator
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT || '5432' }}
      DB_NAME: ${{ vars.DB_NAME || 'postgres' }}
      DB_USER: ${{ vars.DB_USER || 'postgres' }}
      DB_PASSWORD_SECRET_ARN: ${{ vars.DB_PASSWORD_SECRET_ARN }}
      JWT_SECRET_ARN: ${{ vars.JWT_SECRET_ARN }}
      DOCUMENT_S3_BUCKET: legal-administrator-documents

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate local configuration and helper
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_deployment.py backend
          python3 .github/scripts/test_deploy_ecs.py
          python3 .github/scripts/test_automation.py
          test -f legal-administrator/Dockerfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install current AWS CLI
        run: python3 -m pip install --upgrade awscli

      - name: Validate AWS resources and resolve RDS endpoint
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null
          if [ -n "$DB_HOST" ]; then
            host="$DB_HOST"
            port="$DB_PORT"
          else
            host="$(aws rds describe-db-instances --db-instance-identifier "$RDS_INSTANCE_ID" --query 'DBInstances[0].Endpoint.Address' --output text)"
            port="$(aws rds describe-db-instances --db-instance-identifier "$RDS_INSTANCE_ID" --query 'DBInstances[0].Endpoint.Port' --output text)"
          fi
          test -n "$host" && test "$host" != None
          [[ "$port" =~ ^[0-9]+$ ]]
          echo "DB_HOST=$host" >> "$GITHUB_ENV"
          echo "DB_PORT=$port" >> "$GITHUB_ENV"
          aws ecs create-cluster --cluster-name "$ECS_CLUSTER" >/dev/null

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Java 17 image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build --target prod -t "$image" legal-administrator
          docker push "$image"
          echo "IMAGE_URI=$image" >> "$GITHUB_ENV"

      - name: Deploy backend to ECS Express Mode
        id: deploy
        run: python3 .github/scripts/deploy_ecs.py backend

      - name: Verify backend health
        env:
          BACKEND_URL: ${{ steps.deploy.outputs.url }}
        run: python3 .github/scripts/verify_runtime.py health

      - name: Deployment summary
        env:
          BACKEND_URL: ${{ steps.deploy.outputs.url }}
        run: printf '## Backend deployed\n\n%s\n' "$BACKEND_URL" >> "$GITHUB_STEP_SUMMARY"
