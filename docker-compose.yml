services:
  db:
    image: postgres:16-alpine
    container_name: legal_db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_legal_administrator}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-administrador}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-db_legal_administrator}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data
      # aca se inicializan los scripts jeje
      - ./scripts/db_legal_administrator:/docker-entrypoint-initdb.d/01_db_legal_administrator.sql:ro
      - ./scripts/insert.sql:/docker-entrypoint-initdb.d/02_insert.sql:ro
  backend:
    build:
      context: ./legal-administrator
      dockerfile: Dockerfile
      target: dev
    container_name: legal_backend
    restart: on-failure:5
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-db_legal_administrator}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-administrador}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-db_legal_administrator}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-administrador}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./legal-administrator/src:/app/src
      - ./legal-administrator/pom.xml:/app/pom.xml
      - m2_data:/root/.m2
      
  # para levantar todo docker compose --profile all up
  frontend:
    build:
      context: ../Frontend/legal_administrator_frontend
      dockerfile: Dockerfile
      target: dev
    container_name: legal_frontend
    profiles: ["frontend", "all"]
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../Frontend/legal_administrator_frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pg_data:
    name: legal_pg_data
  m2_data:
    name: legal_m2_data
