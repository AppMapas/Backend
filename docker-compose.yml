services:
  db:
    image: postgres:16-alpine
    container_name: legal_db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_legal_administrator}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-administrador}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-db_legal_administrator}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Flyway crea el esquema al iniciar el backend; no duplicar con scripts init.
  backend:
    build:
      context: ./legal-administrator
      dockerfile: Dockerfile
      target: dev
    container_name: legal_backend
    restart: on-failure:5
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: 8080
      GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_FRONTEND_ORIGIN: ${GOOGLE_FRONTEND_ORIGIN:-http://localhost:5173}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_TOKEN_KEY_VERSION: ${GOOGLE_TOKEN_KEY_VERSION:-v1}
      GOOGLE_SYNC_DELAY_MS: ${GOOGLE_SYNC_DELAY_MS:-30000}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:-http://localhost:5173}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-db_legal_administrator}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-administrador}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en Backend/.env}
      DOCUMENT_STORAGE_PROVIDER: ${DOCUMENT_STORAGE_PROVIDER:-local}
      DOCUMENT_LOCAL_DIRECTORY: /app/data/documents
      DOCUMENT_GCS_BUCKET: ${DOCUMENT_GCS_BUCKET:-}
      DOCUMENT_MAX_FILE_SIZE: ${DOCUMENT_MAX_FILE_SIZE:-20MB}
      DOCUMENT_MAX_REQUEST_SIZE: ${DOCUMENT_MAX_REQUEST_SIZE:-21MB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./legal-administrator/src:/app/src
      - ./legal-administrator/pom.xml:/app/pom.xml
      - m2_data:/root/.m2
      - document_data:/app/data/documents
      
  # docker compose up --build levanta los tres servicios.
  frontend:
    build:
      context: ../Frontend/legal_administrator_frontend
      dockerfile: Dockerfile
      target: dev
    container_name: legal_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    volumes:
      - ../Frontend/legal_administrator_frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  document_data:
    name: legal_document_data
  pg_data:
    name: legal_pg_data
  m2_data:
    name: legal_m2_data
